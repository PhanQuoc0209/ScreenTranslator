<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Capture Overlay</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      cursor: crosshair;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .instructions-pill {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      padding: 7px 18px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .key-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="instructions-pill" id="instructions">
    <span>Select screen region to translate</span>
    <span>•</span>
    <span>Drag & Release to capture</span>
    <span>•</span>
    <span><span class="key-badge">Esc</span> Cancel</span>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let bgImage = null;
    let isDrawing = false;
    let startX = 0;
    let startY = 0;
    let currentX = 0;
    let currentY = 0;
    let scale = 1;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    // Initialize from main process
    if (window.electronAPI && window.electronAPI.onOverlayInit) {
      window.electronAPI.onOverlayInit((data) => {
        scale = data.scaleFactor || 1;
        if (data.screenshotDataUrl) {
          const img = new Image();
          img.onload = () => {
            bgImage = img;
            draw();
          };
          img.src = data.screenshotDataUrl;
        } else {
          draw();
        }
      });
    }

    function getNormalizedRect() {
      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const w = Math.abs(currentX - startX);
      const h = Math.abs(currentY - startY);
      return { x, y, width: w, height: h };
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw background freeze-frame if available
      if (bgImage) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
      }

      // Semi-transparent dark overlay
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (isDrawing) {
        const rect = getNormalizedRect();
        if (rect.width > 2 && rect.height > 2) {
          // Clear selection area
          ctx.clearRect(rect.x, rect.y, rect.width, rect.height);
          if (bgImage) {
            ctx.drawImage(
              bgImage,
              rect.x * (bgImage.naturalWidth / canvas.width),
              rect.y * (bgImage.naturalHeight / canvas.height),
              rect.width * (bgImage.naturalWidth / canvas.width),
              rect.height * (bgImage.naturalHeight / canvas.height),
              rect.x,
              rect.y,
              rect.width,
              rect.height
            );
          }

          // Crisp selection border
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.strokeRect(rect.x, rect.y, rect.width, rect.height);

          // Dimension badge
          const dimText = `${Math.round(rect.width)} × ${Math.round(rect.height)} px`;
          ctx.font = '11px Segoe UI, sans-serif';
          const textMetrics = ctx.measureText(dimText);
          const tagPadding = 6;
          const tagHeight = 20;
          const tagWidth = textMetrics.width + tagPadding * 2;

          let tagY = rect.y - tagHeight - 4;
          if (tagY < 4) tagY = rect.y + 4;

          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.fillRect(rect.x, tagY, tagWidth, tagHeight);
          ctx.fillStyle = '#f8fafc';
          ctx.textBaseline = 'middle';
          ctx.fillText(dimText, rect.x + tagPadding, tagY + tagHeight / 2);
        }
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      isDrawing = true;
      startX = e.clientX;
      startY = e.clientY;
      currentX = e.clientX;
      currentY = e.clientY;
      draw();
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      currentX = e.clientX;
      currentY = e.clientY;
      draw();
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const rect = getNormalizedRect();
      if (rect.width >= 8 && rect.height >= 8) {
        if (window.electronAPI && window.electronAPI.confirmOverlay) {
          window.electronAPI.confirmOverlay(rect);
        }
      } else {
        draw();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.electronAPI && window.electronAPI.cancelOverlay) {
          window.electronAPI.cancelOverlay();
        }
      }
    });

    resizeCanvas();
  </script>
</body>
</html>
